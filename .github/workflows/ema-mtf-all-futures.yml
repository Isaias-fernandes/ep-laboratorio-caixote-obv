name: EMA MTF - ativos Spot do EP e candles fechados

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    paths:
      - 'market-universe.mjs'
      - 'automation/scan-ema-mtf-all-futures.mjs'
      - '.github/workflows/ema-mtf-all-futures.yml'
      - 'ema-mtf-core.mjs'
      - 'automation/experiment-storage.mjs'
      - 'automation/track-experiment.mjs'

permissions:
  contents: write

concurrency:
  group: ema-mtf-all-futures
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/ema-mtf-auto.json
            /data/quality/state.json
            /data/experiment-history/ema-mtf/
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Coletar ativos do universo EP com núcleo EMA compartilhado
        run: node automation/scan-ema-mtf-all-futures.mjs
      - name: Publicar coleta somente se houver mudanca
        run: |
          if [ -z "$(git status --porcelain -- data/ema-mtf-auto.json data/experiment-history/ema-mtf)" ]; then
            echo "Sem alteracoes na coleta EMA."
            exit 0
          fi
          git config user.name "ema-mtf-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ema-mtf-auto.json data/experiment-history/ema-mtf
          git commit -m "data: atualizar EMA MTF Spot de 50 ativos"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then exit 0; fi
          done
          exit 1

