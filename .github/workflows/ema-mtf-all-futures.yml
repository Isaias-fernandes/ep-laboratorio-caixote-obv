name: EMA MTF - Todos Futuros USDT

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    paths:
      - 'automation/scan-ema-mtf-all-futures.mjs'
      - '.github/workflows/ema-mtf-all-futures.yml'

permissions:
  contents: write

concurrency:
  group: ema-mtf-all-futures
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Varrer todos os contratos USDT perpetuos
        run: node automation/scan-ema-mtf-all-futures.mjs
      - name: Publicar coleta somente se houver mudanca
        run: |
          if [ -z "$(git status --porcelain -- data/ema-mtf-auto.json)" ]; then
            echo "Sem alteracoes na coleta EMA."
            exit 0
          fi
          git config user.name "ema-mtf-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ema-mtf-auto.json
          git commit -m "data: atualizar coleta EMA MTF de todos os futuros USDT"
          git pull --rebase origin main
          git push
