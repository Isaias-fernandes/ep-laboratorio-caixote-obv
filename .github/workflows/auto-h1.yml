name: Laboratorio H1 Automatico

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    paths:
      - 'automation/scan-h1.mjs'
      - 'automation/archive-h1-history.mjs'
      - 'automation/smart-money-history.mjs'
      - '.github/workflows/auto-h1.yml'

permissions:
  contents: write

concurrency:
  group: laboratorio-h1-auto
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rodar varredura H1 96/80
        run: node automation/scan-h1.mjs
      - name: Atualizar historico experimental permanente
        run: node automation/archive-h1-history.mjs
      - name: Enriquecer historico com observador Smart Money
        run: node automation/smart-money-history.mjs
      - name: Publicar somente se houver mudanca
        run: |
          if [ -z "$(git status --porcelain -- data/auto-signals.json data/h1-history.json)" ]; then
            echo "Sem alteracoes nos sinais ou no historico."
            exit 0
          fi
          git config user.name "laboratorio-h1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auto-signals.json data/h1-history.json
          git commit -m "data: atualizar sinais, historico H1 e observador Smart Money"
          git push
