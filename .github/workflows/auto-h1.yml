name: Laboratorio H1 Automatico

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    paths:
      - 'automation/scan-h1.mjs'
      - '.github/workflows/auto-h1.yml'

permissions:
  contents: write

concurrency:
  group: laboratorio-h1-auto
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rodar varredura H1 96/80
        run: node automation/scan-h1.mjs
      - name: Publicar somente se houver mudanca
        run: |
          if git diff --quiet -- data/auto-signals.json; then
            echo "Sem alteracoes nos sinais."
            exit 0
          fi
          git config user.name "laboratorio-h1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auto-signals.json
          git commit -m "data: atualizar sinais automaticos H1"
          git push
