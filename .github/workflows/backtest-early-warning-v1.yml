name: Backtest Early Warning H1

on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * *'
  push:
    paths:
      - 'early-warning-patterns-v1.js'
      - 'automation/backtest-early-warning-v1.cjs'
      - '.github/workflows/backtest-early-warning-v1.yml'

permissions:
  contents: write

concurrency:
  group: laboratorio-early-warning-v1
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rodar pre-sinais H1 e medir antecedencia
        run: node automation/backtest-early-warning-v1.cjs
      - name: Publicar resultado
        run: |
          if [ -z "$(git status --porcelain -- data/backtest-early-warning-v1.json)" ]; then
            echo "Sem alteracoes no resultado."
            exit 0
          fi
          git config user.name "laboratorio-early-warning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest-early-warning-v1.json
          git commit -m "data: atualizar estudo early warning H1"
          git push
