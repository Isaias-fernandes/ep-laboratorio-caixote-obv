name: Backtest Motores Experimentais H1 96

on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental-motors.js'
      - 'automation/backtest-experimental-motors.cjs'
      - '.github/workflows/backtest-experimental-motors.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar backtest H1 96
        run: node automation/backtest-experimental-motors.cjs
      - name: Publicar resultado
        run: |
          if [ -z "$(git status --porcelain -- data/backtest-experimental-motors.json)" ]; then
            echo 'Sem alteração de resultado'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtest-experimental-motors.json
          git commit -m 'data: atualizar backtest dos motores experimentais H1 96'
          git push
