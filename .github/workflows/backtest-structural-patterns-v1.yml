name: Backtest Estrutural H1 96 80

on:
  workflow_dispatch:
  schedule:
    - cron: '50 9 * * *'
  push:
    paths:
      - 'structural-pattern-detectors-v1.js'
      - 'automation/backtest-structural-patterns-v1.cjs'
      - '.github/workflows/backtest-structural-patterns-v1.yml'

permissions:
  contents: write

concurrency:
  group: laboratorio-estrutural-v1
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rodar H1 contexto 96 horizonte 96 score 80
        run: node automation/backtest-structural-patterns-v1.cjs
      - name: Publicar resultado
        run: |
          if [ -z "$(git status --porcelain -- data/backtest-structural-patterns-v1.json)" ]; then
            echo "Sem alteracoes no resultado."
            exit 0
          fi
          git config user.name "laboratorio-estrutural-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest-structural-patterns-v1.json
          git commit -m "data: atualizar estudo estrutural H1 96 80"
          git push
