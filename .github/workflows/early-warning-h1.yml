name: Early Warning H1 Automatico

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    paths:
      - 'early-warning-patterns-v1.js'
      - 'automation/scan-early-warning-h1.mjs'
      - '.github/workflows/early-warning-h1.yml'

permissions:
  contents: write

concurrency:
  group: laboratorio-early-warning-h1
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rodar scanner Early Warning H1
        run: node automation/scan-early-warning-h1.mjs
      - name: Publicar feed
        run: |
          if [ -z "$(git status --porcelain -- data/early-warning-auto.json)" ]; then
            echo "Sem alteracoes no feed."
            exit 0
          fi
          git config user.name "laboratorio-early-warning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/early-warning-auto.json
          git commit -m "data: atualizar early warning H1"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Conflito temporario ao publicar; tentativa $attempt/3."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Falha ao publicar apos 3 tentativas."
          exit 1
