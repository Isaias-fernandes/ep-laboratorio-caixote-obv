name: Laboratory M5 M15 H1 signals
on:
  workflow_run:
    workflows: ['Laboratorio H1 Automatico']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/live-signals.yml'
      - 'automation/scan-live.mjs'
      - 'lab-live-core.mjs'
      - 'lab-signal-engine.mjs'
      - 'm6-parallel-core.mjs'
      - 'm6-long-tracking.mjs'
      - 'automation/m6-parallel-collector.mjs'
      - 'structural-pattern-detectors-v1.js'
      - 'quality/**'
      - 'automation/quality-collector.mjs'
      - 'automation/json-store.mjs'
      - 'automation/intraday-candles.mjs'
      - 'tests/**'
permissions:
  contents: write
concurrency:
  group: laboratory-live-signals
  cancel-in-progress: false
jobs:
  scan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/live-signals.json
            /data/live-history/
            /data/m6-parallel.json
            /data/m6-parallel-history/
            /data/quality/
            /data/tidb-export-checkpoint.json
            /data/intraday/
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate signal lifecycle
        run: node --test tests/*.test.mjs
      - name: Scan closed candles and archive every event
        run: node automation/scan-live.mjs
      - name: Publish feed and permanent archive together
        if: always() && !cancelled()
        run: |
          git config user.name laboratorio-live-bot
          git config user.email actions@users.noreply.github.com
          git add data/live-signals.json data/live-history data/m6-parallel.json data/m6-parallel-history data/quality data/intraday/buffer.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: laboratory M5 M15 H1 signals and permanent archive"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1


